<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#991515"/>
  <text x="24" y="64" font-family="Manrope, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">⚠ EMERGENCY HELP</text>
  <text x="24" y="102" font-family="Manrope, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Critical Low Blood Sugar (53 mg/dL)</text>

  <rect x="24" y="128" width="164" height="60" rx="16" fill="#FFFFFF"/>
  <text x="64" y="165" font-family="Manrope, sans-serif" font-size="18" font-weight="800" fill="#991515">📞 Call 112</text>

  <rect x="202" y="128" width="164" height="60" rx="16" fill="#B32424" stroke="#FFFFFF" stroke-width="2"/>
  <text x="226" y="165" font-family="Manrope, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">📞 Call Rajesh</text>

  <rect x="24" y="216" width="342" height="420" rx="22" fill="#FFFFFF"/>
  <text x="44" y="254" font-family="Manrope, sans-serif" font-size="20" font-weight="800" fill="#991515">What to do right now</text>
  <text x="44" y="290" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#16262E">• Sit or lie down safely right now — do not</text>
  <text x="44" y="312" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#16262E">  walk alone or drive.</text>
  <text x="44" y="346" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#16262E">• If awake and able to swallow safely, take</text>
  <text x="44" y="368" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#16262E">  fast-acting sugar per your doctor's plan.</text>
  <text x="44" y="402" font-family="Manrope, sans-serif" font-size="16" font-weight="600" fill="#16262E">• Do NOT take any diabetes medicine right now.</text>
  <text x="44" y="436" font-family="Manrope, sans-serif" font-size="16" font-weight="700" fill="#0B4F6C">• Ask your doctor or pharmacist.</text>

  <rect x="44" y="472" width="230" height="52" rx="14" fill="#991515"/>
  <text x="64" y="504" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">💬 WhatsApp Rajesh (Demo)</text>

  <rect x="24" y="680" width="342" height="52" rx="16" fill="#991515" stroke="#FFFFFF" stroke-width="2"/>
  <text x="68" y="712" font-family="Manrope, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">✕ I am safe — Return to SehatSaathi</text>
  <text x="24" y="768" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">SehatSaathi is a support tool, not a doctor. In an emergency call 112.</text>
</svg>
