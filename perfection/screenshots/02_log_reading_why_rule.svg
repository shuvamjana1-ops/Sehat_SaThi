<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#E8F1F5"/>
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF" stroke="#C9DCE5"/>
  <text x="20" y="38" font-family="Manrope, sans-serif" font-size="20" font-weight="800" fill="#0B4F6C">Log Reading · Deterministic Check</text>

  <rect x="16" y="84" width="358" height="390" rx="22" fill="#FEF4E2" stroke="#D9820B" stroke-width="2"/>
  <rect x="32" y="104" width="118" height="32" rx="16" fill="#FFFFFF" stroke="#D9820B"/>
  <text x="46" y="125" font-family="Manrope, sans-serif" font-size="14" font-weight="800" fill="#935306">⚠ Caution</text>
  <text x="32" y="168" font-family="Manrope, sans-serif" font-size="22" font-weight="800" fill="#0B4F6C">High Blood Sugar (250 mg/dL)</text>

  <rect x="32" y="186" width="326" height="78" rx="14" fill="#FFFFFF" stroke="#C9DCE5"/>
  <text x="46" y="210" font-family="Manrope, sans-serif" font-size="14" font-weight="800" fill="#0B4F6C">Why this result</text>
  <text x="46" y="232" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#16262E">Rule: Blood sugar 250 mg/dL is between 250 and</text>
  <text x="46" y="250" font-family="Manrope, sans-serif" font-size="13" font-weight="600" fill="#16262E">299 mg/dL (&gt;= 250 mg/dL caution threshold).</text>

  <text x="32" y="294" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#16262E">• Sip plain water and avoid sugary drinks.</text>
  <text x="32" y="320" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#16262E">• Check scheduled medicines — never double a dose.</text>
  <text x="32" y="346" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#16262E">• Recheck in a few hours and share with clinic.</text>
  <text x="32" y="372" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#0B4F6C">• Ask your doctor or pharmacist.</text>

  <rect x="32" y="398" width="326" height="52" rx="14" fill="#0E6E8C"/>
  <text x="90" y="430" font-family="Manrope, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">✨ Explain simply with AI</text>

  <rect x="0" y="784" width="390" height="60" fill="#FFFFFF" stroke="#C9DCE5"/>
  <text x="20" y="818" font-family="Manrope, sans-serif" font-size="13" font-weight="700" fill="#16262E">SehatSaathi is a support tool, not a doctor. Call 112.</text>
</svg>
