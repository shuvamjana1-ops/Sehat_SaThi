name: Deploy SehatSaathi to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout, Build Signed APK, and Deploy without External Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "1. Checking out repository via native git..."
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

          echo "2. Configuring pre-installed Temurin JDK 21..."
          if [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
            export JAVA_HOME="/usr/lib/jvm/temurin-21-jdk-amd64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version

          echo "3. Building signed Android APK..."
          set +e
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null 2>&1
          fi

          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-9.3.1/bin/gradle :app:assembleDebug -Pkotlin.compiler.execution.strategy=daemon --stacktrace
          set -e

          echo "4. Staging static web app and APK..."
          mkdir -p /tmp/_site
          if [ -d "docs" ]; then
            cp -r docs/* /tmp/_site/
          fi
          if [ -f "index.html" ]; then
            cp index.html /tmp/_site/index.html
          fi
          touch /tmp/_site/.nojekyll
          if [ -d "data" ]; then
            mkdir -p /tmp/_site/data
            cp -r data/* /tmp/_site/data/
          fi

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/_site/SehatSaathi-debug.apk
            mkdir -p /tmp/_site/docs
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/_site/docs/SehatSaathi-debug.apk
            ls -lh /tmp/_site/SehatSaathi-debug.apk

            echo "5. Publishing APK to GitHub Releases (v1.0.0)..."
            gh release create v1.0.0 /tmp/_site/SehatSaathi-debug.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SehatSaathi Android APK (v1.0.0)" \
              --notes "Signed Android Debug APK built automatically by GitHub Actions." \
              || gh release upload v1.0.0 /tmp/_site/SehatSaathi-debug.apk --repo "${GITHUB_REPOSITORY}" --clobber || true
          fi

          echo "6. Deploying site and APK to gh-pages branch..."
          cd /tmp/_site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy SehatSaathi web app and signed Android APK"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

          echo "7. Configuring GitHub Pages to serve from gh-pages branch..."
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type="legacy" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" || true

          echo "Deployment complete!"
