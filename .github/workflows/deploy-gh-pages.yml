name: Deploy SehatSaathi to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-prepare-site:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Keystore, Secrets, and Android SDK 36.1
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null || true
          fi

      - name: Install Gradle 9.3.1 and Build Signed Debug APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage GitHub Pages site and Publish Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          if [ -d "docs" ]; then
            cp -r docs/* _site/
          fi
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          fi
          touch _site/.nojekyll
          if [ -d "data" ]; then
            mkdir -p _site/data
            cp -r data/* _site/data/
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk _site/SehatSaathi-debug.apk
            mkdir -p _site/docs
            cp app/build/outputs/apk/debug/app-debug.apk _site/docs/SehatSaathi-debug.apk
            echo "Built APK size:"
            ls -lh _site/SehatSaathi-debug.apk
            gh release create v1.0.0 _site/SehatSaathi-debug.apk \
              --title "SehatSaathi Android APK (v1.0.0)" \
              --notes "Signed Android Debug APK built automatically by GitHub Actions." \
              || gh release upload v1.0.0 _site/SehatSaathi-debug.apk --clobber || true
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build-and-prepare-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
