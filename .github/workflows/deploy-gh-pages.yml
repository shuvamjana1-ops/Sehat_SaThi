name: Deploy SehatSaathi to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-prepare-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace || echo "Gradle build warning encountered, continuing to stage site"

      - name: Stage GitHub Pages site directory
        run: |
          mkdir -p _site
          if [ -d "docs" ]; then
            cp -r docs/* _site/
          fi
          touch _site/.nojekyll
          if [ -d "data" ]; then
            mkdir -p _site/data
            cp -r data/* _site/data/
          fi
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" _site/SehatSaathi-debug.apk
            echo "Successfully packaged APK: $APK_PATH"
          else
            echo "Warning: APK not found, deploying web portal without APK file."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-prepare-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
